<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Standup Report</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: var(--tg-theme-text-color, #000000);
        }

        .subtitle {
            color: var(--tg-theme-hint-color, #999);
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 15px;
            color: var(--tg-theme-text-color, #000000);
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--tg-theme-hint-color, #ddd);
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .radio-group {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .submit-button {
            width: 100%;
            padding: 15px;
            background: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .submit-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error {
            color: #e74c3c;
            padding: 15px;
            background: #fee;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--tg-theme-hint-color, #999);
        }
    </style>
</head>
<body>
    <div id="loading" class="loading">
        <p>⏳ Đang tải...</p>
    </div>

    <div id="error" class="error" style="display: none;"></div>

    <div id="formContainer" style="display: none;">
        <h1 id="projectName">📋 Daily Standup Report</h1>
        <p class="subtitle" id="projectDate"></p>

        <form id="standupForm">
            <div class="form-group">
                <label>👤 Họ và tên</label>
                <input type="text" id="name" name="name" required placeholder="Nguyễn Văn A">
            </div>

            <div class="form-group">
                <label>📅 Ngày</label>
                <input type="date" id="date" name="date" required>
            </div>

            <div class="form-group">
                <label>✅ Hôm qua làm gì?</label>
                <textarea id="yesterday" name="yesterday" required placeholder="Mô tả công việc đã làm..."></textarea>
            </div>

            <div class="form-group">
                <label>📝 Hôm nay làm gì?</label>
                <textarea id="today" name="today" required placeholder="Kế hoạch công việc hôm nay..."></textarea>
            </div>

            <div class="form-group">
                <label>🎯 Có đúng tiến độ không?</label>
                <div class="radio-group">
                    <label><input type="radio" name="onTrack" value="Đúng" checked> ✅ Đúng</label>
                    <label><input type="radio" name="onTrack" value="Chậm"> ⚠️ Chậm</label>
                </div>
            </div>

            <div class="form-group">
                <label>🚧 Có vướng mắc gì không?</label>
                <textarea id="blockers" name="blockers" placeholder="Nếu không có thì để trống..."></textarea>
            </div>

            <button type="submit" class="submit-button" id="submitButton">📝 Gửi báo cáo</button>
        </form>
    </div>

    <script>
        // Production webhook endpoint with HTTPS
        const WEBHOOK_URL = 'https://standup-hook.qcloud.asia';
        
        let projectId = null;
        const projectNames = {
            'xlite': 'FS.XLite.Develop',
            'apecfinance': 'ApecFinance',
            'ai-development': 'FS.AI.Development'
        };

        // Get project from URL parameter
        function getProjectFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('project') || 'xlite'; // Default to xlite
        }

        // Initialize form
        function initializeForm() {
            projectId = getProjectFromURL();
            
            // Update UI
            const projectName = projectNames[projectId] || projectId;
            document.getElementById('projectName').textContent = `📋 ${projectName}`;
            document.getElementById('projectDate').textContent = new Date().toLocaleDateString('vi-VN');
            document.getElementById('date').valueAsDate = new Date();
            
            // Show form
            document.getElementById('loading').style.display = 'none';
            document.getElementById('formContainer').style.display = 'block';
        }

        // Submit form
        document.getElementById('standupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitButton');
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Đang gửi...';
            
            const formData = {
                project: projectId,
                user: document.getElementById('name').value,
                date: document.getElementById('date').value,
                yesterday: document.getElementById('yesterday').value,
                today: document.getElementById('today').value,
                ontrack: document.querySelector('input[name="onTrack"]:checked').value === 'Đúng' ? 'yes' : 'no',
                blockers: document.getElementById('blockers').value || 'Không có'
            };
            
            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                
                if (result.ok) {
                    alert('✅ Đã gửi báo cáo thành công!');
                    this.reset();
                    document.getElementById('date').valueAsDate = new Date();
                } else {
                    throw new Error(result.error || result.message || 'Unknown error');
                }
            } catch (error) {
                alert(`❌ Lỗi: ${error.message}`);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '📝 Gửi báo cáo';
            }
        });

        // Initialize
        initializeForm();
    </script>
</body>
</html>
